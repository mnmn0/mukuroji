<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f9f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1412" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>mukuroji – オフライン / Offline</title>
    <link rel="stylesheet" href="/offline.css" />
    <script src="/offline.js"></script>
  </head>
  <body>
    <main>
      <img src="/pwa-192x192.png" alt="" />
      <h1>オフラインです <span lang="en">/ You are offline</span></h1>
      <p>ネットワークに接続できないため、このページを開けませんでした。接続が戻ると自動で再読み込みします。</p>
      <p lang="en">This page could not be loaded without a network connection. It reloads automatically when you are back online.</p>
      <button type="button" id="retry">再試行 / Retry</button>
    </main>
  </body>
</html>
