name: Trusted review Skill validation

on:
  pull_request_target:
    types:
      - labeled
      - opened
      - reopened
      - synchronize
      - unlabeled
    paths:
      - ".codex/skills/mukuroji-review/**"
      - ".github/workflows/oxc.yml"
      - ".github/workflows/review-skill.yml"
      - "AGENTS.md"
      - "**/AGENTS.md"
      - "README.md"
      - "package.json"
      - "scripts/validate-mukuroji-review-skill.ts"
      - "scripts/validate-mukuroji-review-skill.test.ts"

permissions:
  contents: read
  issues: read

jobs:
  validate:
    name: trusted-skill-validator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted validator
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          path: trusted
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: |
            .github/workflows/review-skill.yml
            AGENTS.md
            **/AGENTS.md
            scripts/validate-mukuroji-review-skill.test.ts
            scripts/validate-mukuroji-review-skill.ts
          sparse-checkout-cone-mode: false

      - name: Checkout target Skill as data
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          path: target
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          sparse-checkout: |
            .codex/skills/mukuroji-review
            .github/workflows/review-skill.yml
            AGENTS.md
            **/AGENTS.md
            scripts/validate-mukuroji-review-skill.test.ts
            scripts/validate-mukuroji-review-skill.ts
          sparse-checkout-cone-mode: false

      - name: Require approval for trust-root changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          trust_root_changed=0
          for relative_path in \
            ".github/workflows/review-skill.yml" \
            "AGENTS.md" \
            "scripts/validate-mukuroji-review-skill.test.ts" \
            "scripts/validate-mukuroji-review-skill.ts"
          do
            trusted_entry="$(
              git -C trusted ls-tree "${BASE_SHA}" -- "${relative_path}"
            )"
            target_entry="$(
              git -C target ls-tree "${HEAD_SHA}" -- "${relative_path}"
            )"

            case "${target_entry}" in
              "100644 blob "*)
                ;;
              *)
                echo "Unsafe or missing trust-root path: ${relative_path}"
                exit 1
                ;;
            esac

            if [ "${trusted_entry}" != "${target_entry}" ]; then
              echo "Trust-root change: ${relative_path}"
              trust_root_changed=1
            fi
          done

          trusted_skill_entry="$(
            git -C trusted ls-tree \
              "${BASE_SHA}" -- ".codex/skills/mukuroji-review"
          )"
          target_skill_entry="$(
            git -C target ls-tree \
              "${HEAD_SHA}" -- ".codex/skills/mukuroji-review"
          )"
          case "${target_skill_entry}" in
            "040000 tree "*)
              ;;
            *)
              echo "Unsafe or missing review Skill tree"
              exit 1
              ;;
          esac
          if [ "${trusted_skill_entry}" != "${target_skill_entry}" ]; then
            echo "Trust-root change: .codex/skills/mukuroji-review"
            trust_root_changed=1
          fi

          list_agents_entries() {
            local repository_path="$1"
            local commit_oid="$2"
            local entry
            local entry_path

            while IFS= read -r -d '' entry
            do
              entry_path="${entry#*$'\t'}"
              case "${entry_path}" in
                AGENTS.md|*/AGENTS.md)
                  printf '%s\0' "${entry}"
                  ;;
              esac
            done < <(
              git -C "${repository_path}" ls-tree -rz --full-tree "${commit_oid}"
            )
          }

          while IFS= read -r -d '' target_agents_entry
          do
            target_agents_metadata="${target_agents_entry%%$'\t'*}"
            target_agents_path="${target_agents_entry#*$'\t'}"
            case "${target_agents_metadata}" in
              "100644 blob "*)
                ;;
              *)
                printf \
                  'Unsafe AGENTS.md mode or object: %q\n' \
                  "${target_agents_path}"
                exit 1
                ;;
            esac
          done < <(list_agents_entries target "${HEAD_SHA}")

          trusted_agents_digest="$(
            list_agents_entries trusted "${BASE_SHA}" |
              sha256sum |
              cut -d ' ' -f 1
          )"
          target_agents_digest="$(
            list_agents_entries target "${HEAD_SHA}" |
              sha256sum |
              cut -d ' ' -f 1
          )"
          if [ "${trusted_agents_digest}" != "${target_agents_digest}" ]; then
            echo "Trust-root change: one or more AGENTS.md files"
            trust_root_changed=1
          fi

          if [ "${trust_root_changed}" -eq 1 ]; then
            REQUIRED_LABEL="review-ok:${HEAD_SHA}"
            approval_actor="$(
              gh api --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/events?per_page=100" |
                jq --raw-output --arg required_label "${REQUIRED_LABEL}" '
                  [
                    .[][] |
                    select(
                      (.event == "labeled" or .event == "unlabeled") and
                      .label.name == $required_label
                    )
                  ] |
                  sort_by([.created_at, .id]) |
                  last |
                  select(.event == "labeled" and .actor.type == "User") |
                  .actor.login // empty
                '
            )"
            if \
              [ -z "${approval_actor}" ] ||
              [ "${approval_actor}" = "${PR_AUTHOR}" ]
            then
              echo "An independent repository maintainer must apply:"
              echo "${REQUIRED_LABEL}"
              exit 1
            fi

            approval_permission="$(
              gh api \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "repos/${GITHUB_REPOSITORY}/collaborators/${approval_actor}/permission" \
                --jq '.permission'
            )"
            case "${approval_permission}" in
              admin|write)
                ;;
              *)
                echo "Approval actor must have write, maintain, or admin access:"
                echo "${approval_actor}"
                exit 1
                ;;
            esac
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Run trusted validator against target data
        run: |
          bun test trusted/scripts/validate-mukuroji-review-skill.test.ts
          bun trusted/scripts/validate-mukuroji-review-skill.ts \
            target/.codex/skills/mukuroji-review \
            target
