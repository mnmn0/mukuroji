name: Static analysis

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: static-analysis-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate review Skill
        run: |
          bun run skill:validate
          bun run skill:validate:test

      - name: Run oxlint
        run: bun run oxc:lint:ci

      - name: Run Web ESLint
        run: bun run web:lint:ci

      - name: Validate workspace dependency boundaries
        run: bun run dependencies:check

      - name: Detect unused and unresolved dependencies
        run: bun run knip:check
