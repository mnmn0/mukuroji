name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: strict-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Strict typecheck shared contracts
        run: bun run typecheck:contracts

      - name: Strict typecheck Public API compatibility checker
        run: bun run typecheck:api-contract

      - name: Strict typecheck all Server TypeScript
        run: bun run typecheck:server

      - name: Strict typecheck and build Web
        run: bun run web:build

      - name: Strict typecheck and build CDK
        run: bun run cdk:build

  unit-tests:
    name: application-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check tested Public API snapshot freshness
        run: |
          if [[ -f contracts/openapi/public-api-v1.json ]]; then
            bun run api:contract:check
          fi

      - name: Test Public API compatibility checker
        run: bun run api:contract:test

      - name: Run Server unit and integration tests
        run: bun run server:test

      - name: Run AI assistance offline release evaluation
        run: bun run ai-assistance:eval

      - name: Run Web unit tests
        run: bun run web:test

  web-e2e-shard:
    name: web-e2e-shard (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium headless shell
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Run Web end-to-end tests
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: bun run web:e2e:desktop --shard="${SHARD}"

  web-e2e-pwa:
    name: web-e2e-pwa
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium headless shell
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Run PWA end-to-end tests
        run: bun run web:e2e:pwa

  # Keeps the existing `web-e2e` check name so branch protection does not change.
  web-e2e:
    name: web-e2e
    if: always()
    needs:
      - web-e2e-shard
      - web-e2e-pwa
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every end-to-end job to pass
        env:
          SHARD_RESULT: ${{ needs.web-e2e-shard.result }}
          PWA_RESULT: ${{ needs.web-e2e-pwa.result }}
        run: |
          echo "web-e2e-shard: ${SHARD_RESULT}, web-e2e-pwa: ${PWA_RESULT}"
          test "${SHARD_RESULT}" = success
          test "${PWA_RESULT}" = success
