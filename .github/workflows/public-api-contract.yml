name: Trusted Public API contract

on:
  workflow_run:
    workflows:
      - Public API contract signal
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  compatibility:
    name: evaluate-public-api-contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: public-api-contract-publisher
      deployment: false
    steps:
      - name: Resolve the current pull request
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          RUN_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          WORKFLOW_SOURCE_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail

          if [[ "$RUN_EVENT" != "pull_request" ]]; then
            echo "Only pull_request signal runs are accepted." >&2
            exit 1
          fi
          if [[ "$RUN_WORKFLOW_PATH" != ".github/workflows/public-api-contract-signal.yml" ]]; then
            echo "Only the canonical signal workflow path is accepted." >&2
            exit 1
          fi
          if [[ ! "$RUN_HEAD_SHA" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "The signal run does not have a valid head commit." >&2
            exit 1
          fi

          pulls="$(
            gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
              -f state="open" \
              -f base="main" \
              -f head="$RUN_HEAD_OWNER:$RUN_HEAD_BRANCH" \
              -F per_page=100
          )"
          matching_pulls="$(
            jq \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg head_repository "$RUN_HEAD_REPOSITORY" \
              --arg head_branch "$RUN_HEAD_BRANCH" \
              --arg head_sha "$RUN_HEAD_SHA" \
              '[
                .[]
                | select(
                    .base.repo.full_name == $repository
                    and .base.ref == "main"
                    and .head.repo.full_name == $head_repository
                    and .head.ref == $head_branch
                    and .head.sha == $head_sha
                  )
              ]' \
              <<<"$pulls"
          )"
          if [[ "$(jq 'length' <<<"$matching_pulls")" != "1" ]]; then
            echo "The signal run must resolve to exactly one current pull request." >&2
            exit 1
          fi

          pull_request_number="$(jq -r '.[0].number' <<<"$matching_pulls")"
          base_sha="$(jq -r '.[0].base.sha' <<<"$matching_pulls")"
          head_repository="$(jq -r '.[0].head.repo.full_name' <<<"$matching_pulls")"
          head_sha="$(jq -r '.[0].head.sha' <<<"$matching_pulls")"
          if [[ ! "$base_sha" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "The pull request does not have a valid base commit." >&2
            exit 1
          fi
          if [[ "$WORKFLOW_SOURCE_SHA" != "$base_sha" ]]; then
            echo "The trusted workflow source must equal the current pull request base." >&2
            exit 1
          fi

          {
            printf 'base_sha=%s\n' "$base_sha"
            printf 'head_repository=%s\n' "$head_repository"
            printf 'head_sha=%s\n' "$head_sha"
            printf 'pull_request_number=%s\n' "$pull_request_number"
            printf 'workflow_source_sha=%s\n' "$WORKFLOW_SOURCE_SHA"
          } >>"$GITHUB_OUTPUT"

      - name: Create publisher token
        id: publisher
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PUBLIC_API_CHECK_APP_ID }}
          private-key: ${{ secrets.PUBLIC_API_CHECK_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write

      - name: Start dedicated App check
        id: check
        env:
          BASE_SHA: ${{ steps.context.outputs.base_sha }}
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
          HEAD_SHA: ${{ steps.context.outputs.head_sha }}
          PULL_REQUEST_NUMBER: ${{ steps.context.outputs.pull_request_number }}
        run: |
          set -euo pipefail

          check="$(
            jq -n \
              --arg base_sha "$BASE_SHA" \
              --arg details_url \
                "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --arg external_id \
                "$GITHUB_REPOSITORY#$PULL_REQUEST_NUMBER:$HEAD_SHA:$BASE_SHA:$GITHUB_RUN_ID" \
              --arg head_sha "$HEAD_SHA" \
              '{
                name: "public-api-compatibility",
                head_sha: $head_sha,
                status: "in_progress",
                external_id: $external_id,
                details_url: $details_url,
                output: {
                  title: "Public API compatibility is being evaluated",
                  summary: ("Trusted base: `" + $base_sha + "`")
                }
              }' |
              gh api --method POST \
                "repos/$GITHUB_REPOSITORY/check-runs" \
                --input -
          )"
          check_id="$(jq -r '.id' <<<"$check")"
          if [[ ! "$check_id" =~ ^[0-9]+$ ]]; then
            echo "The publisher did not return a valid check run." >&2
            exit 1
          fi
          printf 'check_id=%s\n' "$check_id" >>"$GITHUB_OUTPUT"

      - name: Checkout trusted base
        id: checkout_base
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: contract-base
          persist-credentials: false
          ref: ${{ steps.context.outputs.base_sha }}
          sparse-checkout: |
            .github/workflows/public-api-contract-signal.yml
            .github/workflows/public-api-contract.yml
            contracts/openapi/public-api-v1.json
            contracts/src/openapi.ts
            scripts/check-public-api-contract.ts
          sparse-checkout-cone-mode: false

      - name: Checkout candidate as data
        id: checkout_candidate
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The candidate is verified as data and is never executed.
          allow-unsafe-pr-checkout: true
          fetch-depth: 1
          path: contract-head
          persist-credentials: false
          ref: ${{ steps.context.outputs.head_sha }}
          repository: ${{ steps.context.outputs.head_repository }}
          sparse-checkout: |
            .github/workflows/public-api-contract-signal.yml
            .github/workflows/public-api-contract.yml
            contracts/openapi/public-api-v1.json
            contracts/src/openapi.ts
            scripts/check-public-api-contract.ts
          sparse-checkout-cone-mode: false

      - name: Setup Bun
        id: setup_bun
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Compare candidate with trusted contract
        id: evaluate
        if: >-
          steps.checkout_base.outcome == 'success' &&
          steps.checkout_candidate.outcome == 'success' &&
          steps.setup_bun.outcome == 'success'
        continue-on-error: true
        env:
          CONTRACT_BASE_DIRECTORY: ${{ github.workspace }}/contract-base
          CONTRACT_BASE_SHA: ${{ steps.context.outputs.base_sha }}
          CONTRACT_HEAD_DIRECTORY: ${{ github.workspace }}/contract-head
          CONTRACT_HEAD_SHA: ${{ steps.context.outputs.head_sha }}
        working-directory: contract-base
        run: |
          set -euo pipefail

          require_regular_blob() {
            local repository="$1"
            local path="$2"
            local entry
            local mode
            local type
            local oid
            local worktree_oid
            local tracked_path

            entry="$(git -C "$repository" ls-tree HEAD -- "$path")"
            if [[ -z "$entry" ]]; then
              echo "$path must exist in $repository." >&2
              exit 1
            fi
            read -r mode type oid tracked_path <<<"$entry"
            if [[ "$mode" != "100644" || "$type" != "blob" || -z "$oid" ]]; then
              echo "$path must be a regular tracked blob in $repository." >&2
              exit 1
            fi
            worktree_oid="$(
              git -C "$repository" hash-object --no-filters "$path"
            )"
            if [[ "$worktree_oid" != "$oid" ]]; then
              echo "$path worktree bytes do not match commit blob $oid." >&2
              exit 1
            fi
            printf '%s\n' "$oid"
          }

          require_bounded_regular_blob() {
            local repository="$1"
            local path="$2"
            local maximum_bytes="$3"
            local oid
            local size

            oid="$(require_regular_blob "$repository" "$path")"
            size="$(git -C "$repository" cat-file -s "$oid")"
            if (( size > maximum_bytes )); then
              echo "$path exceeds the trusted byte limit." >&2
              exit 1
            fi
            printf '%s\n' "$oid"
          }

          actual_base_sha="$(
            git -C "$CONTRACT_BASE_DIRECTORY" rev-parse HEAD^{commit}
          )"
          actual_head_sha="$(
            git -C "$CONTRACT_HEAD_DIRECTORY" rev-parse HEAD^{commit}
          )"
          if [[ "$actual_base_sha" != "$CONTRACT_BASE_SHA" ]]; then
            echo "Trusted checkout does not match the pull request base SHA." >&2
            exit 1
          fi
          if [[ "$actual_head_sha" != "$CONTRACT_HEAD_SHA" ]]; then
            echo "Candidate checkout does not match the pull request head SHA." >&2
            exit 1
          fi

          for trust_root in \
            ".github/workflows/public-api-contract-signal.yml" \
            ".github/workflows/public-api-contract.yml" \
            "scripts/check-public-api-contract.ts"
          do
            base_oid="$(
              require_regular_blob "$CONTRACT_BASE_DIRECTORY" "$trust_root"
            )"
            head_oid="$(
              require_regular_blob "$CONTRACT_HEAD_DIRECTORY" "$trust_root"
            )"
            if [[ "$base_oid" != "$head_oid" ]]; then
              echo "$trust_root requires an isolated trust-root rotation." >&2
              exit 1
            fi
          done

          require_bounded_regular_blob "$CONTRACT_BASE_DIRECTORY" \
            "contracts/src/openapi.ts" 2097152 >/dev/null
          require_bounded_regular_blob "$CONTRACT_HEAD_DIRECTORY" \
            "contracts/src/openapi.ts" 2097152 >/dev/null
          head_snapshot_oid="$(
            require_bounded_regular_blob "$CONTRACT_HEAD_DIRECTORY" \
              "contracts/openapi/public-api-v1.json" 2097152
          )"
          base_snapshot_entry="$(
            git -C "$CONTRACT_BASE_DIRECTORY" ls-tree HEAD -- \
              "contracts/openapi/public-api-v1.json"
          )"

          mkdir -p "$RUNNER_TEMP/public-api-contract-home"
          if [[ -n "$base_snapshot_entry" ]]; then
            base_snapshot_oid="$(
              require_bounded_regular_blob "$CONTRACT_BASE_DIRECTORY" \
                "contracts/openapi/public-api-v1.json" 2097152
            )"
            (
              cd "$CONTRACT_BASE_DIRECTORY"
              env -i \
                CI=true \
                HOME="$RUNNER_TEMP/public-api-contract-home" \
                PATH="$PATH" \
                bun --config=/dev/null --no-env-file --no-install \
                  --cwd="$CONTRACT_BASE_DIRECTORY" \
                  "$CONTRACT_BASE_DIRECTORY/scripts/check-public-api-contract.ts" \
                  --candidate "$CONTRACT_HEAD_DIRECTORY/contracts/openapi/public-api-v1.json" \
                  --candidate-source "$CONTRACT_HEAD_DIRECTORY/contracts/src/openapi.ts"
            )
            echo "Compared trusted snapshot $base_snapshot_oid with candidate $head_snapshot_oid."
          else
            (
              cd "$CONTRACT_BASE_DIRECTORY"
              env -i \
                CI=true \
                HOME="$RUNNER_TEMP/public-api-contract-home" \
                PATH="$PATH" \
                bun --config=/dev/null --no-env-file --no-install \
                  --cwd="$CONTRACT_BASE_DIRECTORY" \
                  "$CONTRACT_BASE_DIRECTORY/scripts/check-public-api-contract.ts" \
                  --bootstrap-candidate "$CONTRACT_HEAD_DIRECTORY/contracts/openapi/public-api-v1.json" \
                  --candidate-source "$CONTRACT_HEAD_DIRECTORY/contracts/src/openapi.ts"
            )
            echo "Bootstrapped candidate snapshot $head_snapshot_oid."
          fi

      - name: Complete dedicated App check
        if: always() && steps.check.outcome == 'success'
        env:
          APP_TOKEN: ${{ steps.publisher.outputs.token }}
          BASE_SHA: ${{ steps.context.outputs.base_sha }}
          CHECK_ID: ${{ steps.check.outputs.check_id }}
          CHECKOUT_BASE_OUTCOME: ${{ steps.checkout_base.outcome }}
          CHECKOUT_CANDIDATE_OUTCOME: ${{ steps.checkout_candidate.outcome }}
          EVALUATION_OUTCOME: ${{ steps.evaluate.outcome }}
          HEAD_SHA: ${{ steps.context.outputs.head_sha }}
          PULL_REQUEST_NUMBER: ${{ steps.context.outputs.pull_request_number }}
          READ_TOKEN: ${{ github.token }}
          SETUP_BUN_OUTCOME: ${{ steps.setup_bun.outcome }}
          WORKFLOW_SOURCE_SHA: ${{ steps.context.outputs.workflow_source_sha }}
        run: |
          set -euo pipefail

          conclusion="success"
          summary="Candidate contract is backward compatible with the trusted base."
          if [[
            "$CHECKOUT_BASE_OUTCOME" != "success" ||
            "$CHECKOUT_CANDIDATE_OUTCOME" != "success" ||
            "$SETUP_BUN_OUTCOME" != "success" ||
            "$EVALUATION_OUTCOME" != "success"
          ]]; then
            conclusion="failure"
            summary="Trusted checkout, setup, or compatibility evaluation failed. Inspect the linked workflow run."
          fi

          if current_pull="$(
            GH_TOKEN="$READ_TOKEN" gh api \
              "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST_NUMBER"
          )" &&
            current_main="$(
              GH_TOKEN="$READ_TOKEN" gh api \
                "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
                --jq '.object.sha'
            )"
          then
            current_base_sha="$(jq -r '.base.sha' <<<"$current_pull")"
            current_head_sha="$(jq -r '.head.sha' <<<"$current_pull")"
            current_state="$(jq -r '.state' <<<"$current_pull")"
            current_target="$(jq -r '.base.ref' <<<"$current_pull")"
            if [[
              "$current_state" != "open" ||
              "$current_target" != "main" ||
              "$current_base_sha" != "$BASE_SHA" ||
              "$current_head_sha" != "$HEAD_SHA" ||
              "$current_main" != "$BASE_SHA" ||
              "$WORKFLOW_SOURCE_SHA" != "$BASE_SHA"
            ]]; then
              conclusion="failure"
              summary="The pull request head, base, target, or trusted workflow changed during evaluation."
            fi
          else
            conclusion="failure"
            summary="The pull request could not be revalidated after compatibility evaluation."
          fi

          jq -n \
            --arg conclusion "$conclusion" \
            --arg details_url \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg summary "$summary" \
            '{
              status: "completed",
              conclusion: $conclusion,
              details_url: $details_url,
              output: {
                title: (
                  if $conclusion == "success"
                  then "Public API compatibility passed"
                  else "Public API compatibility failed"
                  end
                ),
                summary: $summary
              }
            }' |
            GH_TOKEN="$APP_TOKEN" gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/check-runs/$CHECK_ID" \
              --input -

          if [[ "$conclusion" != "success" ]]; then
            exit 1
          fi
