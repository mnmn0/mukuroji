name: CDK

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: cdk-security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: cdk-security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CDK
        run: bun run cdk:build

      - name: Test CDK
        run: bun run cdk:test

      - name: Run CDK security checks
        run: bun run cdk:nag

      - name: Synthesize CloudFormation
        run: >-
          bun --filter cdk cdk synth --quiet
          -c triageIndexDeploymentStage=wake
          -c teamIssueCommentIndexDeploymentStage=comment
