name: Local runtime

on:
  pull_request:
    paths:
      - .github/workflows/local-runtime.yml
      - bun.lock
      - contracts/**
      - docker-compose.yml
      - floci/**
      - package.json
      - server/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/local-runtime.yml
      - bun.lock
      - contracts/**
      - docker-compose.yml
      - floci/**
      - package.json
      - server/**

permissions:
  contents: read

jobs:
  smoke:
    name: local-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_SECRET_ACCESS_KEY: test
      ENTERPRISE_IDENTITY_TOKEN_HASH_SECRET: '2222222222222222222222222222222222222222222222222222222222222222'
      ENTERPRISE_SSO_STATE_SECRET: '3333333333333333333333333333333333333333333333333333333333333333'
      FLOCI_IMAGE: floci/floci:1.5.33-compat
      MUKUROJI_WORKSPACE_AUDIT_PSEUDONYM_KEY: '1111111111111111111111111111111111111111111111111111111111111111'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare Floci generated directory
        run: install -d -m 0777 .floci/generated

      - name: Start Floci
        run: docker compose up -d floci

      - name: Wait for Floci bootstrap
        run: |
          for attempt in {1..300}; do
            docker compose logs floci > "${RUNNER_TEMP}/floci.log"
            if [ -f .floci/generated/cognito.env ]; then
              exit 0
            fi
            sleep 1
          done

          cat "${RUNNER_TEMP}/floci.log"
          exit 1

      - name: Exercise the local API and Work Item schema
        run: |
          set -a
          source .floci/generated/cognito.env
          set +a

          bun run server:dev > "${RUNNER_TEMP}/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health >/dev/null; then
              break
            fi
            if ! kill -0 "${server_pid}" 2>/dev/null; then
              cat "${RUNNER_TEMP}/server.log"
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:3000/api/health >/dev/null
          login_response="$(curl --fail-with-body --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"email":"demo@example.com","password":"Password123!"}' \
            http://127.0.0.1:3000/api/auth/login)"
          access_token="$(jq -r '.accessToken // empty' <<< "${login_response}")"
          if [ -z "${access_token}" ]; then
            echo 'Local login response did not include an access token.' >&2
            exit 1
          fi

          issues_response="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${access_token}" \
            http://127.0.0.1:3000/api/teams/core-team/issues)"
          if ! jq -e \
            '.teamId == "core-team" and
            (.issues | type) == "array" and
            any(.issues[];
              .id == "wireframe" and
              .teamId == "core-team" and
              .assignedProjectId == "refero" and
              .schemaVersion == 1 and
              .workflowSchemaVersion == 1 and
              .workflowStatusId == "in-progress" and
              .statusCategory == "started"
            )' \
            <<< "${issues_response}" >/dev/null; then
            echo 'Work Item API did not return the expected seeded issue.' >&2
            jq . <<< "${issues_response}" >&2
            exit 1
          fi

      - name: Print Floci logs on failure
        if: failure()
        run: docker compose logs floci

      - name: Print server logs on failure
        if: failure()
        run: cat "${RUNNER_TEMP}/server.log" 2>/dev/null || true

      - name: Stop Floci
        if: always()
        run: docker compose down --volumes
