name: Real server smoke

on:
  pull_request:
    paths:
      - .github/workflows/real-server-smoke.yml
      - bun.lock
      - contracts/**
      - docker-compose.yml
      - floci/**
      - package.json
      - playwright.real-server.config.ts
      - server/**
      - web/**
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    name: real-server-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_SECRET_ACCESS_KEY: test
      ENTERPRISE_IDENTITY_TOKEN_HASH_SECRET: '2222222222222222222222222222222222222222222222222222222222222222'
      FLOCI_IMAGE: floci/floci:1.5.33-compat
      MUKUROJI_WORKSPACE_AUDIT_PSEUDONYM_KEY: '1111111111111111111111111111111111111111111111111111111111111111'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Prepare Floci generated directory
        run: install -d -m 0777 .floci/generated

      - name: Start Floci and wait for bootstrap
        run: bun run floci:up

      - name: Run real-server smoke suite
        run: bun run web:e2e:real-server

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-report-real-server
          path: |
            playwright-report-real-server/
            test-results/
          retention-days: 7

      - name: Print Floci logs on failure
        if: failure()
        run: docker compose logs floci

      - name: Stop Floci
        if: always()
        run: docker compose down --volumes
